<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Stock Castilla · Las Barricas Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #142219;
    --bg-deep: #0e1913;
    --card: #1c3126;
    --card-hi: #234032;
    --line: #2c4736;
    --amber: #c98a46;
    --amber-soft: #e0ac6e;
    --cream: #f1e9da;
    --cream-dim: #b9c4b8;
    --mint: #7fb88f;
    --red: #c1543d;
    --red-soft: #d97a66;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;background:var(--bg-deep);color:var(--cream);font-family:'Inter',sans-serif;height:100%;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(201,138,70,0.10), transparent 60%),
      var(--bg-deep);
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  .app{max-width:480px; margin:0 auto; width:100%; min-height:100vh; display:flex; flex-direction:column; position:relative;}

  /* HEADER — label / bottle-cap motif */
  header{padding:28px 20px 18px; text-align:center; position:relative;}
  .logo-badge{
    width:88px; height:88px; border-radius:50%;
    margin:0 auto 10px;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.5), 0 0 0 3px var(--amber), 0 0 0 5px var(--bg-deep);
    overflow:hidden;
  }
  .logo-badge img{width:100%; height:100%; object-fit:cover;}
  .cap{
    width:54px;height:54px;border-radius:50%;
    margin:0 auto 10px;
    background: conic-gradient(from 180deg, var(--amber-soft), var(--amber) 30%, #8a5a26 60%, var(--amber) 85%, var(--amber-soft));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45), inset 0 0 0 3px rgba(20,34,25,0.55);
  }
  .cap::after{
    content:"";
    width:34px;height:34px;border-radius:50%;
    background: repeating-conic-gradient(var(--bg-deep) 0deg 8deg, #0a120d 8deg 16deg);
    opacity:0.35;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem; letter-spacing:0.02em;
    margin:0; color:var(--cream);
  }
  .locality{
    font-family:'Fraunces', serif; font-weight:600; font-size:0.95rem;
    color:var(--amber-soft); letter-spacing:0.08em; text-transform:uppercase;
    margin-top:2px;
  }
  .subtitle{
    font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--cream-dim); margin-top:6px; font-weight:600;
  }
  .divider{
    height:1px; margin:16px auto 0; width:70%;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }

  main{flex:1; padding:4px 16px 100px;}

  /* TABS content */
  .view{display:none; animation: fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* FORM */
  .form-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:20px; margin-top:10px;
  }
  label{
    display:block; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--cream-dim); margin:16px 0 6px; font-weight:600;
  }
  label:first-of-type{margin-top:0;}
  input[type="text"], input[type="number"]{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg-deep); color:var(--cream); font-family:'Inter',sans-serif; font-size:1rem;
    outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--amber);}
  input[type="number"]{font-family:'JetBrains Mono',monospace; font-weight:700;}
  select{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg-deep); color:var(--cream); font-family:'Inter',sans-serif; font-size:1rem;
    outline:none; transition:border-color .15s;
    appearance:none; -webkit-appearance:none;
    background-image: linear-gradient(45deg, transparent 50%, var(--amber-soft) 50%), linear-gradient(135deg, var(--amber-soft) 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(50% - 3px), calc(100% - 14px) calc(50% - 3px);
    background-size: 6px 6px, 6px 6px; background-repeat:no-repeat;
  }
  select:focus{border-color:var(--amber);}
  select option{color:#1a1a1a; background:#ffffff;}
  .cat-pill{
    display:inline-block; font-size:0.66rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;
    padding:2px 9px; border-radius:100px; background:var(--card-hi); color:var(--amber-soft);
    border:1px solid var(--line); margin-top:4px;
  }
  .cat-group{margin-top:22px;}
  .cat-group:first-child{margin-top:0;}
  .cat-group-title{
    display:flex; align-items:center; gap:8px; margin:0 2px 10px;
    font-family:'Fraunces', serif; font-size:0.92rem; font-weight:600; color:var(--amber-soft);
  }
  .cat-group-title .line{flex:1; height:1px; background:var(--line);}
  .cat-group-title .n{
    font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--cream-dim);
    background:var(--card); border:1px solid var(--line); padding:1px 8px; border-radius:100px;
  }
  .stock-row{display:flex; align-items:stretch; gap:10px;}
  .stepper{
    display:flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; flex-shrink:0;
  }
  .stepper button{
    width:42px; background:var(--card-hi); color:var(--amber-soft); border:none; font-size:1.2rem;
    cursor:pointer; font-weight:700;
  }
  .stepper button:active{background:var(--amber); color:var(--bg-deep);}
  textarea{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg-deep); color:var(--cream); font-family:'Inter',sans-serif; font-size:0.95rem;
    resize:none; outline:none; min-height:54px;
  }
  textarea:focus{border-color:var(--amber);}
  .save-btn{
    width:100%; margin-top:20px; padding:15px; border:none; border-radius:12px;
    background:linear-gradient(135deg, var(--amber-soft), var(--amber));
    color:#241505; font-weight:700; font-size:0.95rem; letter-spacing:0.03em;
    cursor:pointer; box-shadow:0 6px 16px rgba(201,138,70,0.25);
  }
  .save-btn:active{transform:scale(0.98);}
  .hint{font-size:0.75rem; color:var(--cream-dim); margin-top:10px; text-align:center; line-height:1.4;}
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translate(-50%, 12px); opacity:0;
    background:var(--mint); color:#0e1913; padding:10px 18px; border-radius:100px;
    font-weight:600; font-size:0.85rem; pointer-events:none; transition:all .3s ease; z-index:50;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  /* LIST */
  .list-head{display:flex; align-items:baseline; justify-content:space-between; margin:14px 2px 10px;}
  .list-head h2{font-family:'Fraunces', serif; font-size:1.05rem; font-weight:600; margin:0;}
  .count-tag{
    font-family:'JetBrains Mono',monospace; font-size:0.75rem; font-weight:700;
    background:var(--card-hi); color:var(--amber-soft); padding:3px 10px; border-radius:100px;
    border:1px solid var(--line);
  }
  .item{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
    transition: opacity .35s ease, transform .35s ease, max-height .35s ease, margin .35s ease, padding .35s ease;
  }
  .item.removing{opacity:0; transform:scale(0.94) translateX(10px);}
  .stock-badge{
    flex-shrink:0; min-width:46px; height:46px; border-radius:50%;
    background:var(--bg-deep); border:2px solid var(--amber);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .stock-badge b{font-family:'JetBrains Mono',monospace; font-size:1.05rem; color:var(--amber-soft); line-height:1;}
  .item-body{flex:1; min-width:0;}
  .item-name{font-weight:600; font-size:0.98rem; color:var(--cream); word-break:break-word;}
  .item-meta{font-size:0.72rem; color:var(--cream-dim); margin-top:2px;}
  .item-note{font-size:0.78rem; color:var(--amber-soft); margin-top:3px; font-style:italic;}
  .check-btn{
    flex-shrink:0; width:38px; height:38px; border-radius:50%; border:2px solid var(--mint);
    background:transparent; color:var(--mint); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition: all .15s;
  }
  .check-btn:active{background:var(--mint); color:#0e1913;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--cream-dim);
  }
  .empty .cap{opacity:0.5; margin-bottom:18px;}
  .empty p{font-size:0.9rem; line-height:1.6; max-width:260px; margin:0 auto;}
  .empty b{color:var(--amber-soft); display:block; font-family:'Fraunces',serif; font-size:1.05rem; margin-bottom:6px; font-weight:600;}

  /* BOTTOM NAV */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    background:rgba(14,25,19,0.92); backdrop-filter: blur(10px);
    border-top:1px solid var(--line);
    display:flex; justify-content:center;
  }
  .nav-inner{max-width:480px; width:100%; display:flex; padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
  .nav-btn{
    flex:1; background:none; border:none; color:var(--cream-dim); padding:8px 4px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:0.7rem; letter-spacing:0.04em; font-weight:600;
    position:relative;
  }
  .nav-btn .icon{font-size:1.25rem;}
  .nav-btn.active{color:var(--amber-soft);}
  .nav-badge{
    position:absolute; top:2px; right:calc(50% - 22px);
    background:var(--red); color:#fff; font-family:'JetBrains Mono',monospace;
    font-size:0.62rem; font-weight:700; min-width:16px; height:16px; border-radius:100px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .sync-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--mint);
    margin-left:6px; animation: pulse 2s infinite;
  }

  /* FILTER CHIPS — compacto, una sola línea con scroll horizontal */
  .filter-row{
    display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .filter-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:6px 12px; border-radius:100px; border:1px solid var(--line);
    background:var(--card); color:var(--cream-dim); font-size:0.72rem; font-weight:600;
    cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px;
    transition: all .15s;
  }
  .chip .cnt{
    font-family:'JetBrains Mono',monospace; font-size:0.65rem; opacity:0.8;
  }
  .chip.active{
    background:var(--amber); border-color:var(--amber); color:#241505;
  }
  .chip.active .cnt{opacity:1;}

  /* CONFIRM MODAL */
  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:60;
    background:rgba(8,14,10,0.72); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; padding:24px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:26px 22px 20px; max-width:320px; width:100%; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
    animation: popIn .18s ease;
  }
  @keyframes popIn{from{transform:scale(0.92); opacity:0;} to{transform:none; opacity:1;}}
  .modal-icon{
    width:44px; height:44px; border-radius:50%; margin:0 auto 14px;
    background:var(--card-hi); border:2px solid var(--mint); color:var(--mint);
    display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:700;
  }
  .modal-text{
    font-size:0.95rem; color:var(--cream); line-height:1.5; margin:0 0 20px;
  }
  .modal-text b{color:var(--amber-soft); font-family:'Fraunces',serif; font-weight:600;}
  .modal-actions{display:flex; gap:10px;}
  .modal-btn{
    flex:1; padding:12px; border-radius:12px; border:1px solid var(--line);
    font-weight:700; font-size:0.9rem; cursor:pointer; background:var(--bg-deep); color:var(--cream-dim);
  }
  .modal-btn.yes{
    background:linear-gradient(135deg, var(--amber-soft), var(--amber)); color:#241505; border:none;
  }
  .modal-btn:active{transform:scale(0.97);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
</style>

    <h1>Las Barricas Express</h1>
    <div class="locality">Castilla</div>
    <div class="subtitle">Control de stock diario</div>
    <div class="divider"></div>
  </header>

  <main>
    <!-- REGISTRAR -->
    <section id="view-add" class="view active">
      <div class="form-card">
        <label for="pname">Producto</label>
        <input type="text" id="pname" list="catalog" placeholder="Ej. Ron Cartavio 750ml" autocomplete="off">
        <datalist id="catalog"></datalist>

        <label for="pcat">Categoría</label>
        <select id="pcat"></select>

        <label for="pstock">Stock que queda</label>
        <div class="stock-row">
          <input type="number" id="pstock" min="0" placeholder="0" inputmode="numeric">
          <div class="stepper">
            <button type="button" id="stepDown">−</button>
            <button type="button" id="stepUp">+</button>
          </div>
        </div>

        <label for="pnote">Nota (opcional)</label>
        <textarea id="pnote" placeholder="Ej. urgente, se acaba hoy..."></textarea>

        <button class="save-btn" id="saveBtn">Registrar faltante</button>
        <div class="hint">Si ya existe el producto en la lista, se actualiza el stock y la fecha automáticamente.</div>
      </div>
    </section>

    <!-- LISTA -->
    <section id="view-list" class="view">
      <div class="list-head">
        <h2>Lista de compra<span class="sync-dot" title="Sincronizando"></span></h2>
        <span class="count-tag" id="countTag">0</span>
      </div>
      <div class="filter-row" id="filterRow"></div>
      <div id="listContainer"></div>
    </section>
  </main>

  <div class="modal-overlay" id="confirmOverlay">
    <div class="modal-card">
      <div class="modal-icon">✓</div>
      <p class="modal-text">¿Marcar <b id="confirmName">producto</b> como comprado?</p>
      <div class="modal-actions">
        <button class="modal-btn no" id="confirmNo">No</button>
        <button class="modal-btn yes" id="confirmYes">Sí</button>
      </div>
    </div>
  </div>

  <nav>
    <div class="nav-inner">
      <button class="nav-btn active" data-view="add">
        <span class="icon">✎</span> Registrar
      </button>
      <button class="nav-btn" data-view="list">
        <span class="icon">☰</span> Lista de compra
      </button>
    </div>
  </nav>
</div>

<script>
const STORE_ID = 'castilla'; // identificador único de esta tienda, no se repite en la otra
const STORAGE_KEY = 'items:' + STORE_ID;
const CATALOG_KEY = 'catalog:' + STORE_ID;
const CATMAP_KEY = 'catalog-map:' + STORE_ID;
let items = [];
let catalog = [];
let catalogMap = {}; // nombre en minúsculas -> categoría

const CATEGORIES = [
  'Gaseosas',
  'Aguas',
  'Cervezas',
  'Gingers',
  'Energizantes',
  'Bebidas alcohólicas en lata',
  'Rones',
  'Piscos',
  'Whiskys',
  'Vodka',
  'Tequilas',
  'Vinos dulces',
  'Vinos secos',
  'Espumantes',
  'Acompañantes (jarabes)',
  'Golosinas y snacks',
  'Cigarros',
  'Otros'
];

function $(id){ return document.getElementById(id); }

function populateCategorySelect(){
  const sel = $('pcat');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
}

const BLOB_ID = '019fa858-1a6d-7a01-8296-ce3805dc54df'; // almacenamiento público de Castilla
const BLOB_URL = 'https://jsonblob.com/api/jsonBlob/' + BLOB_ID;

async function withRetry(fn, attempts = 3, delayMs = 500){
  let lastErr;
  for(let i = 0; i < attempts; i++){
    try{
      return await fn();
    }catch(e){
      lastErr = e;
      await new Promise(r => setTimeout(r, delayMs * (i + 1)));
    }
  }
  throw lastErr;
}

async function fetchRemote(){
  const noCacheUrl = BLOB_URL + '?t=' + Date.now();
  const res = await fetch(noCacheUrl, {
    cache: 'no-store',
    headers: { 'Accept': 'application/json', 'Cache-Control': 'no-cache' }
  });
  if(!res.ok) throw new Error('No se pudo leer el almacenamiento (' + res.status + ')');
  return await res.json();
}

async function pushRemote(data){
  const res = await fetch(BLOB_URL, {
    method: 'PUT',
    cache: 'no-store',
    headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error('No se pudo guardar (' + res.status + ')');
}

async function loadAll(){
  try{
    const data = await withRetry(fetchRemote);
    items = Array.isArray(data.items) ? data.items : [];
    catalog = Array.isArray(data.catalog) ? data.catalog : [];
    catalogMap = data.catalogMap && typeof data.catalogMap === 'object' ? data.catalogMap : {};
  }catch(e){
    console.error('No se pudo cargar', e);
    items = items || [];
    catalog = catalog || [];
    catalogMap = catalogMap || {};
  }
  renderList();
  renderCatalog();
}

async function saveAll(){
  try{
    await withRetry(() => pushRemote({ items, catalog, catalogMap }));
  }catch(e){
    console.error('No se pudo guardar', e);
    showToast('Error al guardar: ' + (e.message || 'sin conexión'), 4500);
  }
}

// Alias para mantener compatibilidad con el resto del código
async function loadItems(){ await loadAll(); }
async function saveItems(){ await saveAll(); }
async function loadCatalog(){ /* ya se carga junto con loadAll */ }
async function saveCatalog(){ await saveAll(); }
async function loadCatalogMap(){ /* ya se carga junto con loadAll */ }
async function saveCatalogMap(){ await saveAll(); }

function renderCatalog(){
  const dl = $('catalog');
  dl.innerHTML = catalog.map(n => `<option value="${escapeHtml(n)}">`).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDate(ts){
  const d = new Date(ts);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const time = d.toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit'});
  if(isToday) return `Hoy · ${time}`;
  return d.toLocaleDateString('es-PE', {day:'2-digit', month:'short'}) + ` · ${time}`;
}

let activeFilter = null; // null = todas las categorías
let pendingPurchaseId = null;

function renderList(){
  const container = $('listContainer');
  const filterRow = $('filterRow');
  $('countTag').textContent = items.length;
  updateNavBadge();

  if(items.length === 0){
    filterRow.innerHTML = '';
    activeFilter = null;
    container.innerHTML = `
      <div class="empty">
        <div class="cap" style="margin:0 auto;"></div>
        <p><b>Sin pendientes</b>Los productos que registres como faltantes aparecerán aquí para que los marques cuando los compres.</p>
      </div>`;
    return;
  }

  // agrupar por categoría, respetando el orden definido en CATEGORIES
  const groups = {};
  items.forEach(it => {
    const cat = it.category || 'Otros';
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(it);
  });

  const orderedCats = [...CATEGORIES.filter(c => groups[c]), ...Object.keys(groups).filter(c => !CATEGORIES.includes(c))];

  // si la categoría filtrada ya no tiene productos, volvemos a "todas"
  if(activeFilter && !groups[activeFilter]) activeFilter = null;

  // chips de filtro — compactos, en una sola fila con scroll horizontal
  filterRow.innerHTML = `
    <div class="chip ${activeFilter === null ? 'active' : ''}" data-cat="">Todas <span class="cnt">${items.length}</span></div>
    ${orderedCats.map(cat => `
      <div class="chip ${activeFilter === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)} <span class="cnt">${groups[cat].length}</span></div>
    `).join('')}
  `;
  filterRow.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeFilter = chip.dataset.cat || null;
      renderList();
    });
  });

  const catsToRender = activeFilter ? [activeFilter] : orderedCats;

  container.innerHTML = catsToRender.map(cat => {
    const groupItems = groups[cat].sort((a,b) => b.ts - a.ts);
    return `
      <div class="cat-group">
        <div class="cat-group-title">
          <span>${escapeHtml(cat)}</span>
          <span class="line"></span>
          <span class="n">${groupItems.length}</span>
        </div>
        ${groupItems.map(it => `
          <div class="item" data-id="${it.id}">
            <div class="stock-badge"><b>${it.stock}</b></div>
            <div class="item-body">
              <div class="item-name">${escapeHtml(it.name)}</div>
              <div class="item-meta">${formatDate(it.ts)}</div>
              ${it.note ? `<div class="item-note">${escapeHtml(it.note)}</div>` : ''}
            </div>
            <button class="check-btn" data-id="${it.id}" data-name="${escapeHtml(it.name)}" title="Marcar como comprado">✓</button>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');

  container.querySelectorAll('.check-btn').forEach(btn => {
    btn.addEventListener('click', () => askConfirmPurchase(btn.dataset.id, btn.dataset.name));
  });
}

function askConfirmPurchase(id, name){
  pendingPurchaseId = id;
  $('confirmName').textContent = name;
  $('confirmOverlay').classList.add('show');
}

function closeConfirmModal(){
  $('confirmOverlay').classList.remove('show');
  pendingPurchaseId = null;
}

$('confirmNo').addEventListener('click', closeConfirmModal);
$('confirmOverlay').addEventListener('click', (e) => {
  if(e.target === $('confirmOverlay')) closeConfirmModal();
});
$('confirmYes').addEventListener('click', () => {
  const id = pendingPurchaseId;
  closeConfirmModal();
  if(id) markPurchased(id);
});

function updateNavBadge(){
  let badge = document.querySelector('.nav-badge');
  const listBtn = document.querySelector('.nav-btn[data-view="list"]');
  if(items.length > 0){
    if(!badge){
      badge = document.createElement('span');
      badge.className = 'nav-badge';
      listBtn.appendChild(badge);
    }
    badge.textContent = items.length;
  } else if(badge){
    badge.remove();
  }
}

async function markPurchased(id){
  const el = document.querySelector(`.item[data-id="${id}"]`);
  if(el){
    el.classList.add('removing');
    el.style.maxHeight = el.offsetHeight + 'px';
    requestAnimationFrame(() => {
      el.style.maxHeight = '0px';
      el.style.marginBottom = '0px';
      el.style.paddingTop = '0px';
      el.style.paddingBottom = '0px';
    });
  }
  setTimeout(async () => {
    items = items.filter(it => it.id !== id);
    await saveItems();
    renderList();
    showToast('Compra marcada ✓');
  }, 320);
}


function showToast(msg, duration){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration || 1600);
}

async function handleSave(){
  const nameInput = $('pname');
  const stockInput = $('pstock');
  const noteInput = $('pnote');
  const catInput = $('pcat');

  const name = nameInput.value.trim();
  const stock = stockInput.value === '' ? 0 : parseInt(stockInput.value, 10);
  const note = noteInput.value.trim();
  const category = catInput.value;

  if(!name){
    nameInput.focus();
    nameInput.style.borderColor = 'var(--red)';
    setTimeout(() => nameInput.style.borderColor = '', 800);
    return;
  }

  const existing = items.find(it => it.name.toLowerCase() === name.toLowerCase());
  if(existing){
    existing.stock = stock;
    existing.note = note;
    existing.category = category;
    existing.ts = Date.now();
  } else {
    items.push({
      id: 'it_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name, stock, note, category,
      ts: Date.now()
    });
  }

  if(!catalog.some(n => n.toLowerCase() === name.toLowerCase())){
    catalog.push(name);
  }
  catalogMap[name.toLowerCase()] = category;
  renderCatalog();

  await saveAll();
  renderList();

  showToast(existing ? 'Stock actualizado ✓' : 'Faltante registrado ✓');
  nameInput.value = '';
  stockInput.value = '';
  noteInput.value = '';
  nameInput.focus();
}

$('saveBtn').addEventListener('click', handleSave);
$('stepUp').addEventListener('click', () => {
  const inp = $('pstock');
  inp.value = (parseInt(inp.value || 0, 10) + 1);
});
$('stepDown').addEventListener('click', () => {
  const inp = $('pstock');
  inp.value = Math.max(0, parseInt(inp.value || 0, 10) - 1);
});
$('pname').addEventListener('keydown', e => { if(e.key === 'Enter') $('pstock').focus(); });
$('pname').addEventListener('input', () => {
  const key = $('pname').value.trim().toLowerCase();
  if(catalogMap[key]){
    $('pcat').value = catalogMap[key];
  }
});
$('pstock').addEventListener('keydown', e => { if(e.key === 'Enter') handleSave(); });

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    $('view-' + btn.dataset.view).classList.add('active');
    if(btn.dataset.view === 'list') loadItems();
  });
});

// Sync periodically so changes from another phone (e.g. your boss's) show up
setInterval(() => {
  if(document.getElementById('view-list').classList.contains('active')){
    loadItems();
  }
}, 6000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden) loadItems();
});

populateCategorySelect();
loadItems();
</script>
</body>
</html>
